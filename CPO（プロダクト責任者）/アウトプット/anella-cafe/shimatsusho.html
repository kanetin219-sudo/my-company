<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>始末書 | アネラカフェ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Sans JP", sans-serif;
      background: #F7F5F2;
      padding: 20px;
      line-height: 1.6;
    }

    /* タブシステム */
    .tab-container {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid #ddd;
    }

    .tab-button {
      padding: 12px 20px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      color: #999;
      transition: all 0.2s;
      font-family: "Noto Sans JP", sans-serif;
    }

    .tab-button.active {
      color: #1A3A5C;
      border-bottom-color: #1A3A5C;
    }

    .tab-button:hover {
      color: #1A3A5C;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .container {
      max-width: 210mm;
      margin: 0 auto;
      background: white;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* 印刷タイトル（印刷時のみ表示） */
    .print-title {
      display: none;
      text-align: center;
      margin-bottom: 20px;
      font-size: 20pt;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .print-title-company {
      font-size: 12pt;
      margin-top: 5px;
      font-weight: normal;
    }

    /* 見出しスタイル */
    h1 {
      font-family: "Noto Serif JP", serif;
      font-size: 18px;
      margin-bottom: 30px;
      text-align: center;
      font-weight: bold;
    }

    /* セクション */
    .section {
      margin-bottom: 30px;
      page-break-inside: avoid;
    }

    .section-header {
      padding: 10px 15px;
      color: white;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 15px;
      border-radius: 4px;
    }

    .section-header.part-a {
      background: #1A3A5C;
    }

    .section-header.part-b {
      background: #C53030;
    }

    .section-header.part-b2 {
      background: #B7791F;
    }

    .section-header.part-c {
      background: #2E7D32;
    }

    /* ラジオボタン群 */
    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 5px;
    }

    .radio-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid #bbb;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
      user-select: none;
    }

    .radio-chip:hover {
      border-color: #1A3A5C;
      background: #f0f5f9;
    }

    .radio-chip input {
      cursor: pointer;
      margin: 0;
    }

    .accept-chip {
      border-color: #2E7D32;
    }

    .accept-chip:hover {
      background: #e8f5e9;
    }

    /* 写真プレビュー */
    .photo-preview-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 5px;
    }

    .photo-preview-item {
      position: relative;
      width: 100px;
      height: 100px;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      background: #f5f5f5;
    }

    .photo-preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-preview-remove {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(211, 47, 47, 0.9);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-preview-remove:hover {
      background: #b71c1c;
    }

    /* 編集モードバナー */
    .edit-mode-banner {
      background: #fff8e1;
      border: 1px solid #ffca28;
      border-radius: 6px;
      padding: 12px 15px;
      margin: 20px 0 10px;
      font-size: 13px;
      font-weight: bold;
      color: #795548;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn-cancel-edit {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ccc;
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-cancel-edit:hover {
      background: #e0e0e0;
    }

    /* 印刷用：選択された対応の表示 */
    .selected-approval {
      display: none;
      font-size: 12px;
      color: #333;
    }

    /* フォーム行 */
    .form-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 15px;
      margin-bottom: 15px;
      align-items: start;
    }

    .form-row.full {
      grid-template-columns: 1fr;
    }

    .form-row.two-col {
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-row.two-col > div {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 10px;
      align-items: start;
    }

    .form-label {
      font-weight: bold;
      font-size: 13px;
      padding: 8px 0;
      color: #333;
    }

    input[type="text"],
    input[type="date"],
    textarea {
      font-family: "Noto Sans JP", sans-serif;
      font-size: 12px;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 100%;
      background: #fafafa;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
      font-size: 11px;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    textarea:focus {
      outline: none;
      background: #fff;
      border-color: #1A3A5C;
      box-shadow: 0 0 3px rgba(26, 58, 92, 0.2);
    }

    /* チップ（複数選択） */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .chip {
      display: inline-block;
      padding: 8px 12px;
      border: 1px solid #bbb;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
      user-select: none;
    }

    .chip:hover {
      border-color: #1A3A5C;
      background: #f0f5f9;
    }

    .chip.selected {
      background: #1A3A5C;
      color: white;
      border-color: #1A3A5C;
    }

    /* 選択済み種別の表示（印刷時のみ） */
    .selected-category {
      display: none;
      font-size: 12px;
      color: #333;
      line-height: 1.8;
    }

    .selected-category-item {
      display: inline;
      margin-right: 15px;
    }

    /* ボタングループ */
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: "Noto Sans JP", sans-serif;
    }

    .btn-print {
      background: #1A3A5C;
      color: white;
    }

    .btn-print:hover {
      background: #0f2340;
    }

    .btn-reset {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ccc;
    }

    .btn-reset:hover {
      background: #e0e0e0;
    }

    .btn-save {
      background: #2E7D32;
      color: white;
      margin-right: 10px;
    }

    .btn-save:hover {
      background: #1b5e20;
    }

    .btn-save:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* 履歴管理 */
    .history-filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .history-filters input {
      flex: 1;
      min-width: 150px;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .history-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      background: #fafafa;
      cursor: pointer;
      transition: all 0.2s;
    }

    .history-item:hover {
      background: #f0f0f0;
      border-color: #1A3A5C;
      box-shadow: 0 2px 8px rgba(26, 58, 92, 0.1);
    }

    .history-item-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 15px;
      margin-bottom: 10px;
      font-size: 13px;
      align-items: center;
    }

    /* バッジ */
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-handed {
      background: #e8f5e9;
      color: #2E7D32;
    }

    .badge-returned {
      background: #e3f2fd;
      color: #1565C0;
    }

    .badge-agreed {
      background: #e0f2f1;
      color: #00695C;
    }

    .badge-rejected {
      background: #ffebee;
      color: #C53030;
    }

    .badge-none {
      background: #f5f5f5;
      color: #999;
    }

    .badge-accepted {
      background: #ede7f6;
      color: #5E35B1;
    }

    /* 履歴アクションボタン */
    .history-item-actions {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-label {
      font-size: 12px;
      color: #666;
      margin-left: 8px;
    }

    /* 同意・拒否ボタン */
    .btn-approval {
      padding: 6px 16px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
    }

    .btn-approval.agreed {
      color: #00695C;
      border: 1px solid #00695C;
    }

    .btn-approval.agreed:hover {
      background: #e0f2f1;
    }

    .btn-approval.agreed.active {
      background: #00695C;
      color: white;
    }

    .btn-approval.rejected {
      color: #C53030;
      border: 1px solid #C53030;
    }

    .btn-approval.rejected:hover {
      background: #ffebee;
    }

    .btn-approval.rejected.active {
      background: #C53030;
      color: white;
    }

    /* インライン拒否パネル */
    .reject-panel {
      margin-top: 12px;
      padding: 15px;
      background: #fff5f5;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
    }

    .reject-panel-label {
      font-size: 12px;
      font-weight: bold;
      color: #C53030;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    .reject-panel-label:first-child {
      margin-top: 0;
    }

    .reject-reason-input {
      width: 100%;
      min-height: 60px;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: "Noto Sans JP", sans-serif;
      font-size: 12px;
      resize: vertical;
      background: #fff;
    }

    .reject-panel-buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-save-reject {
      background: #C53030;
      color: white;
      padding: 8px 18px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-save-reject:hover {
      background: #a02020;
    }

    .btn-cancel-reject {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ccc;
      padding: 8px 18px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-cancel-reject:hover {
      background: #e0e0e0;
    }

    .btn-toggle-returned {
      background: #fff;
      color: #1565C0;
      border: 1px solid #1565C0;
      padding: 6px 14px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-toggle-returned:hover {
      background: #e3f2fd;
    }

    .btn-toggle-returned.active {
      background: #1565C0;
      color: white;
    }

    .btn-toggle-returned.active:hover {
      background: #0d47a1;
    }

    .history-item-staff {
      font-weight: bold;
      color: #333;
    }

    .history-item-date {
      color: #999;
      font-size: 12px;
    }

    .history-item-status {
      text-align: right;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #e8f5e9;
      color: #2E7D32;
    }

    .history-item-status.pending {
      background: #fff3cd;
      color: #856404;
    }

    .history-item-content {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #999;
    }

    .message {
      padding: 10px 15px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .message.success {
      background: #e8f5e9;
      color: #2E7D32;
      border: 1px solid #81c784;
    }

    .message.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef5350;
    }

    .btn-delete {
      background: #d32f2f;
      color: white;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-delete:hover {
      background: #b71c1c;
    }

    .history-item-delete {
      display: none;
    }

    .history-item:hover .history-item-delete {
      display: inline-block;
    }

    /* 署名欄（印刷時のみ表示） */
    .signature-section {
      display: none;
      margin-top: 40px;
      page-break-inside: avoid;
    }

    .signature-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      text-align: center;
    }

    .signature-box {
      border: 1px solid #333;
      padding: 60px 10px 10px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      position: relative;
    }

    .signature-box-label {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
    }

    /* 印刷用スタイル */
    @media print {
      @page {
        size: A4 portrait;
        margin: 15mm;
      }

      body {
        background: white;
        padding: 0;
      }

      .container {
        max-width: 100%;
        padding: 12mm 15mm;
        box-shadow: none;
      }

      @page {
        size: A4 portrait;
        margin: 12mm 15mm;
      }

      .print-title {
        display: block;
      }

      .print-title-company {
        display: block;
      }

      .button-group {
        display: none;
      }

      .tab-container {
        display: none;
      }

      .chip {
        display: none;
      }

      .selected-category {
        display: block;
      }

      .signature-section {
        display: block;
      }

      /* 印刷時はモノクロ */
      .section-header.part-a {
        background: #333 !important;
        color: white !important;
      }

      .section-header.part-b {
        background: #666 !important;
        color: white !important;
      }

      .section-header.part-b2 {
        background: #888 !important;
        color: white !important;
      }

      .section-header.part-c {
        background: #555 !important;
        color: white !important;
      }

      /* ラジオボタンは非表示にして選択済みテキストを表示 */
      .radio-group {
        display: none;
      }

      .selected-approval {
        display: block;
      }

      #rejectionPhotoInput {
        display: none;
      }

      .photo-preview-remove {
        display: none !important;
      }

      .edit-mode-banner {
        display: none !important;
      }

      /* 入力欄は下線のみ */
      input[type="text"],
      input[type="date"],
      textarea {
        border: none !important;
        border-bottom: 1px solid #333 !important;
        background: transparent !important;
        padding: 4px 0 2px 0 !important;
        font-size: 10pt !important;
        color: #333 !important;
        font-family: "Noto Sans JP", sans-serif !important;
        line-height: 1.4 !important;
      }

      textarea {
        min-height: 50pt !important;
      }

      input[type="text"]::placeholder,
      input[type="date"]::placeholder,
      textarea::placeholder {
        color: transparent !important;
      }

      body {
        font-size: 10pt;
      }

      .section {
        page-break-inside: avoid;
      }

      /* 塗りつぶしを削除 */
      input:focus,
      textarea:focus {
        outline: none;
        box-shadow: none;
      }

      /* リンクのテキスト表示を非表示 */
      a {
        text-decoration: none;
        color: inherit;
      }

      a::after {
        content: "";
      }
    }

    /* レスポンシブ */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      .form-row.two-col {
        grid-template-columns: 1fr;
      }

      .form-row.two-col > div {
        grid-template-columns: 80px 1fr;
      }

      .signature-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- タブシステム -->
    <div class="tab-container">
      <button class="tab-button active" onclick="switchTab('form')">記入フォーム</button>
      <button class="tab-button" onclick="switchTab('history')">履歴管理</button>
    </div>

    <!-- タブ1: 記入フォーム -->
    <div id="form-tab" class="tab-content active">

    <div class="print-title">
      始　末　書
      <div class="print-title-company">ANELLA CAFE 大分店</div>
    </div>

    <!-- PART A: 指導内容（管理者・上長が記入） -->
    <div class="section">
      <div class="section-header part-a">PART A: 指導内容（管理者・上長が記入）</div>

      <div class="form-row two-col">
        <div>
          <label class="form-label">指導日付</label>
          <input type="date" id="instructionDate">
        </div>
        <div>
          <label class="form-label">指導担当者名</label>
          <input type="text" id="instructorName" placeholder="例：田中太郎">
        </div>
      </div>

      <div class="form-row two-col">
        <div>
          <label class="form-label">スタッフ名</label>
          <input type="text" id="staffName" placeholder="例：山田花子">
        </div>
        <div>
          <label class="form-label">発生日時</label>
          <input type="text" id="incidentDateTime" placeholder="例：2026年8月7日 14:30頃">
        </div>
      </div>

      <div class="form-row full">
        <label class="form-label">指導の種別（複数選択可）</label>
        <div class="chip-group" id="categoryChips">
          <span class="chip" data-category="遅刻・早退">遅刻・早退</span>
          <span class="chip" data-category="無断欠勤">無断欠勤</span>
          <span class="chip" data-category="業務上のミス">業務上のミス</span>
          <span class="chip" data-category="接客態度">接客態度</span>
          <span class="chip" data-category="報告・連絡・相談の不足">報告・連絡・相談の不足</span>
          <span class="chip" data-category="規則違反">規則違反</span>
          <span class="chip" data-category="安全管理">安全管理</span>
          <span class="chip" data-category="その他">その他</span>
        </div>
        <div class="selected-category" id="selectedCategoryDisplay"></div>
      </div>

      <div class="form-row full">
        <label class="form-label">指導の内容・事実経緯</label>
        <textarea id="instructionContent" placeholder="具体的な出来事や状況を記入してください"></textarea>
      </div>

      <div class="form-row full">
        <label class="form-label">会社・組織への影響</label>
        <textarea id="companyImpact" placeholder="この行為がもたらした影響について記入してください"></textarea>
      </div>
    </div>

    <!-- PART B: 改善案・反省文（スタッフが記入） -->
    <div class="section">
      <div class="section-header part-b">PART B: 改善案・反省文（指導を受けたスタッフが記入）</div>

      <div class="form-row full">
        <label class="form-label">事実の確認・自己の認識</label>
        <textarea id="factConfirmation" placeholder="指導内容をどう認識しているか、自分の理解を記入してください"></textarea>
      </div>

      <div class="form-row full">
        <label class="form-label">改善策・具体的な行動計画</label>
        <textarea id="improvementPlan" placeholder="今後どのように改善するか、具体的に記入してください"></textarea>
      </div>

      <div class="form-row full">
        <label class="form-label">再発防止へ一言</label>
        <textarea id="preventionPledge" placeholder="今後の改善への想いを記入してください"></textarea>
      </div>
    </div>

    <!-- PART B-2: 本人の対応（同意・拒否） -->
    <div class="section">
      <div class="section-header part-b2">本人の対応</div>

      <div class="form-row full">
        <label class="form-label">本人の意思</label>
        <div class="radio-group" id="approvalRadioGroup">
          <label class="radio-chip"><input type="radio" name="approvalStatus" value="agreed"> 同意する</label>
          <label class="radio-chip"><input type="radio" name="approvalStatus" value="rejected"> 拒否する</label>
          <label class="radio-chip"><input type="radio" name="approvalStatus" value=""> 未対応</label>
        </div>
        <div class="selected-approval" id="selectedApprovalDisplay"></div>
      </div>

      <!-- 拒否した場合のみ表示 -->
      <div id="rejectionFields" style="display:none;">
        <div class="form-row full">
          <label class="form-label">拒否の理由</label>
          <textarea id="rejectionReason" placeholder="本人が拒否した理由を記入してください"></textarea>
        </div>

        <div class="form-row full">
          <label class="form-label">写真（証拠・状況記録）</label>
          <div>
            <input type="file" id="rejectionPhotoInput" accept="image/*" multiple style="font-size:12px; margin-bottom:10px;">
            <div class="photo-preview-list" id="photoPreviewList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- PART C: 会社の受理 -->
    <div class="section">
      <div class="section-header part-c">会社の受理</div>

      <div class="form-row full">
        <label class="form-label">受理状況</label>
        <div class="radio-group">
          <label class="radio-chip accept-chip"><input type="checkbox" id="isAccepted"> この始末書を受理する</label>
        </div>
      </div>

      <div class="form-row two-col">
        <div>
          <label class="form-label">受理担当者名</label>
          <input type="text" id="acceptedBy" placeholder="例：代表 田中">
        </div>
        <div>
          <label class="form-label">受理日</label>
          <input type="date" id="acceptedDate">
        </div>
      </div>
    </div>

    <!-- 署名欄（印刷時のみ） -->
    <div class="signature-section">
      <div class="signature-row">
        <div class="signature-box">
          <div class="signature-box-label">スタッフ</div>
        </div>
        <div class="signature-box">
          <div class="signature-box-label">直属上長</div>
        </div>
        <div class="signature-box">
          <div class="signature-box-label">代表確認</div>
        </div>
      </div>
    </div>

    <!-- 編集モード表示 -->
    <div id="editModeBanner" class="edit-mode-banner" style="display:none;">
      ✏️ 編集モード：既存の記録を修正しています（<span id="editModeStaff"></span>）
      <button type="button" class="btn-cancel-edit" onclick="cancelEdit()">新規作成に戻る</button>
    </div>

    <!-- ボタン -->
    <div class="button-group">
      <button class="btn-save" id="saveBtn" onclick="handleSave()">💾 記録を保存</button>
      <button class="btn-print" onclick="handlePrint()">🖨️ 印刷する</button>
      <button class="btn-reset" onclick="handleReset()">リセット</button>
    </div>
    </div>

    <!-- タブ2: 履歴管理 -->
    <div id="history-tab" class="tab-content">
      <h2 style="margin-bottom: 20px;">指導記録の履歴</h2>

      <div class="history-filters">
        <input type="text" id="searchStaffName" placeholder="スタッフ名で検索...">
        <input type="date" id="searchFromDate" placeholder="開始日">
        <input type="date" id="searchToDate" placeholder="終了日">
        <button onclick="loadHistory()" style="background: #1A3A5C; color: white;">検索</button>
      </div>

      <div id="messageContainer"></div>
      <div id="historyContainer" class="history-list">
        <div class="loading">読み込み中...</div>
      </div>
    </div>
  </div>

  <script>
    // Supabase接続確認
    const supabaseUrl = window.supabase ? 'connected' : 'error';

    // 編集中のレコードID（nullなら新規作成）
    let editingRecordId = null;
    // アップロードされた写真（Base64データURL配列）
    let uploadedPhotos = [];
    // 履歴レコードをID別に保持（インライン拒否入力用）
    let historyRecords = {};

    // 今日の日付をデフォルトに設定
    function setDefaultDates() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      const dateString = `${year}-${month}-${day}`;

      document.getElementById('instructionDate').value = dateString;
    }

    // タブ切り替え
    function switchTab(tabName) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tabName + '-tab').classList.add('active');

      if (tabName === 'history') {
        loadHistory();
      }
    }

    // メッセージ表示
    function showMessage(message, type = 'success') {
      const container = document.getElementById('messageContainer');
      container.innerHTML = `<div class="message ${type}">${message}</div>`;
      setTimeout(() => container.innerHTML = '', 3000);
    }

    // Supabaseに保存
    async function handleSave() {
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中...';

      try {
        const instructorName = document.getElementById('instructorName').value.trim();
        const staffName = document.getElementById('staffName').value.trim();

        if (!instructorName || !staffName) {
          showMessage('指導担当者名とスタッフ名を入力してください', 'error');
          saveBtn.disabled = false;
          saveBtn.textContent = '💾 記録を保存';
          return;
        }

        const selectedCategories = Array.from(document.querySelectorAll('.chip.selected'))
          .map(chip => chip.getAttribute('data-category'));

        // 本人の対応
        const approvalRadio = document.querySelector('input[name="approvalStatus"]:checked');
        const approvalStatus = approvalRadio ? approvalRadio.value : '';

        // 受理情報
        const isAccepted = document.getElementById('isAccepted').checked;
        const acceptedBy = document.getElementById('acceptedBy').value.trim();
        const acceptedDate = document.getElementById('acceptedDate').value;

        const data = {
          created_by: instructorName,
          staff_name: staffName,
          instruction_date: document.getElementById('instructionDate').value,
          incident_datetime: document.getElementById('incidentDateTime').value,
          categories: selectedCategories,
          instruction_content: document.getElementById('instructionContent').value,
          company_impact: document.getElementById('companyImpact').value,
          fact_confirmation: document.getElementById('factConfirmation').value,
          improvement_plan: document.getElementById('improvementPlan').value,
          prevention_pledge: document.getElementById('preventionPledge').value,
          is_submitted: true,
          approval_status: approvalStatus || null,
          rejection_reason: approvalStatus === 'rejected' ? document.getElementById('rejectionReason').value : null,
          rejection_photos: approvalStatus === 'rejected' ? uploadedPhotos : [],
          is_accepted: isAccepted,
          accepted_by: isAccepted ? (acceptedBy || null) : null,
          accepted_at: isAccepted ? (acceptedDate || null) : null,
          updated_at: new Date().toISOString()
        };

        let error;
        if (editingRecordId) {
          // 既存レコードを修正（UPDATE）
          const res = await window.supabase
            .from('shimatsusho_records')
            .update(data)
            .eq('id', editingRecordId);
          error = res.error;
        } else {
          // 新規作成（INSERT）
          const res = await window.supabase
            .from('shimatsusho_records')
            .insert([data]);
          error = res.error;
        }

        if (error) throw error;

        showMessage(editingRecordId ? '✅ 記録を修正しました！' : '✅ 記録を保存しました！');
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 記録を保存';
      } catch (error) {
        console.error('保存エラー:', error);
        showMessage('保存に失敗しました: ' + error.message, 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 記録を保存';
      }
    }

    // 履歴を読み込み
    async function loadHistory() {
      const container = document.getElementById('historyContainer');
      container.innerHTML = '<div class="loading">読み込み中...</div>';

      try {
        const staffName = document.getElementById('searchStaffName').value.trim();
        const fromDate = document.getElementById('searchFromDate').value;
        const toDate = document.getElementById('searchToDate').value;

        let query = window.supabase.from('shimatsusho_records').select('*');

        if (staffName) {
          query = query.ilike('staff_name', `%${staffName}%`);
        }
        if (fromDate) {
          query = query.gte('instruction_date', fromDate);
        }
        if (toDate) {
          query = query.lte('instruction_date', toDate);
        }

        const { data, error } = await query.order('instruction_date', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="loading">該当する記録がありません</div>';
          return;
        }

        // レコードをID別に保持（写真配列は正規化）
        historyRecords = {};
        data.forEach(r => {
          r.rejection_photos = Array.isArray(r.rejection_photos) ? r.rejection_photos : [];
          historyRecords[r.id] = r;
        });

        container.innerHTML = data.map(record => {
          // 対応状況バッジ
          let approvalBadge = '';
          if (record.approval_status === 'agreed') {
            approvalBadge = '<span class="badge badge-agreed">同意</span>';
          } else if (record.approval_status === 'rejected') {
            approvalBadge = '<span class="badge badge-rejected">拒否</span>';
          } else {
            approvalBadge = '<span class="badge badge-none">未対応</span>';
          }

          const photoCount = record.rejection_photos.length;
          const isRejected = record.approval_status === 'rejected';

          return `
          <div class="history-item">
            <div class="history-item-header">
              <div class="history-item-staff" onclick="loadRecordToForm('${record.id}')">${escapeHtml(record.staff_name)}</div>
              <div class="history-item-date" onclick="loadRecordToForm('${record.id}')">${record.instruction_date} 記録</div>
              <button class="btn-delete history-item-delete" onclick="deleteRecord('${record.id}', '${escapeHtml(record.staff_name)}')">削除</button>
            </div>
            <div class="badge-row">
              ${record.is_submitted ? '<span class="badge badge-handed">本人に渡し済み</span>' : ''}
              ${record.is_returned ? '<span class="badge badge-returned">提出済み</span>' : ''}
              ${approvalBadge}
              ${record.is_accepted ? '<span class="badge badge-accepted">受理済み</span>' : ''}
            </div>
            <div class="history-item-content" onclick="loadRecordToForm('${record.id}')">
              <strong>指導内容:</strong> ${escapeHtml(record.instruction_content || '未記入')} <br>
              <strong>指導者:</strong> ${escapeHtml(record.created_by || '')} <br>
              <strong>種別:</strong> ${(record.categories || []).join('、') || '未設定'}
              ${isRejected && record.rejection_reason ? `<br><strong style="color:#C53030;">拒否理由:</strong> ${escapeHtml(record.rejection_reason)}` : ''}
              ${photoCount > 0 ? `<br><strong>写真:</strong> ${photoCount}枚` : ''}
            </div>
            <div class="history-item-actions">
              <button class="btn-toggle-returned ${record.is_returned ? 'active' : ''}" onclick="toggleReturned('${record.id}', ${!record.is_returned})">
                ${record.is_returned ? '✓ 提出済み（取り消す）' : '提出済みにする'}
              </button>
              <span class="action-label">本人の対応：</span>
              <button class="btn-approval agreed ${record.approval_status === 'agreed' ? 'active' : ''}" onclick="setApprovalAgreed('${record.id}')">同意</button>
              <button class="btn-approval rejected ${isRejected ? 'active' : ''}" onclick="toggleRejectPanel('${record.id}')">拒否</button>
            </div>

            <!-- インライン拒否入力パネル -->
            <div class="reject-panel" id="rejectPanel-${record.id}" style="display:${isRejected ? 'block' : 'none'};">
              <div class="reject-panel-label">拒否の理由</div>
              <textarea id="rejectReason-${record.id}" class="reject-reason-input" placeholder="本人が拒否した理由を記入してください">${escapeHtml(record.rejection_reason || '')}</textarea>

              <div class="reject-panel-label">証拠写真（複数可）</div>
              <input type="file" id="rejectPhotoInput-${record.id}" accept="image/*" multiple onchange="handleInlinePhoto('${record.id}', this)" style="font-size:12px; margin-bottom:8px;">
              <div class="photo-preview-list" id="rejectPhotos-${record.id}"></div>

              <div class="reject-panel-buttons">
                <button class="btn-save-reject" onclick="saveRejection('${record.id}')">💾 拒否を保存</button>
                <button class="btn-cancel-reject" onclick="closeRejectPanel('${record.id}')">閉じる</button>
              </div>
            </div>
          </div>
          `;
        }).join('');

        // 既存写真のプレビューを描画（拒否パネルが開いているもの）
        data.forEach(record => {
          if (record.approval_status === 'rejected') {
            renderInlinePhotos(record.id);
          }
        });
      } catch (error) {
        console.error('読み込みエラー:', error);
        container.innerHTML = '<div class="loading">読み込みエラー: ' + error.message + '</div>';
      }
    }

    // XSS対策
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 記録を削除
    async function deleteRecord(recordId, staffName) {
      if (!confirm(`${staffName}の記録を削除してもよろしいですか？\nこの操作は取り消せません。`)) {
        return;
      }

      try {
        const { error } = await window.supabase
          .from('shimatsusho_records')
          .delete()
          .eq('id', recordId);

        if (error) throw error;

        showMessage(`✅ ${staffName}の記録を削除しました`);
        loadHistory(); // 履歴を再読み込み
      } catch (error) {
        console.error('削除エラー:', error);
        showMessage('削除に失敗しました: ' + error.message, 'error');
      }
    }

    // 「提出済み」状態を切り替え（UPDATE）
    async function toggleReturned(recordId, newValue) {
      try {
        const updateData = {
          is_returned: newValue,
          returned_at: newValue ? new Date().toISOString() : null,
          updated_at: new Date().toISOString()
        };

        const { error } = await window.supabase
          .from('shimatsusho_records')
          .update(updateData)
          .eq('id', recordId);

        if (error) throw error;

        showMessage(newValue ? '✅ 提出済みにしました' : '提出済みを取り消しました');
        loadHistory();
      } catch (error) {
        console.error('更新エラー:', error);
        showMessage('更新に失敗しました: ' + error.message, 'error');
      }
    }

    // 履歴カードから「同意」に設定（UPDATE）
    async function setApprovalAgreed(recordId) {
      try {
        const { error } = await window.supabase
          .from('shimatsusho_records')
          .update({ approval_status: 'agreed', updated_at: new Date().toISOString() })
          .eq('id', recordId);
        if (error) throw error;
        showMessage('✅ 「同意」に設定しました');
        loadHistory();
      } catch (error) {
        console.error('更新エラー:', error);
        showMessage('更新に失敗しました: ' + error.message, 'error');
      }
    }

    // 拒否パネルの開閉
    function toggleRejectPanel(recordId) {
      const panel = document.getElementById('rejectPanel-' + recordId);
      if (!panel) return;
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      if (panel.style.display === 'block') {
        renderInlinePhotos(recordId);
      }
    }

    function closeRejectPanel(recordId) {
      const panel = document.getElementById('rejectPanel-' + recordId);
      if (panel) panel.style.display = 'none';
    }

    // 拒否パネルの写真アップロード
    async function handleInlinePhoto(recordId, input) {
      const files = Array.from(input.files);
      const record = historyRecords[recordId];
      if (!record) return;
      for (const file of files) {
        try {
          const dataUrl = await resizeImage(file, 1000, 0.7);
          record.rejection_photos.push(dataUrl);
        } catch (err) {
          console.error('画像処理エラー:', err);
        }
      }
      renderInlinePhotos(recordId);
      input.value = '';
    }

    // 拒否パネルの写真プレビュー描画
    function renderInlinePhotos(recordId) {
      const list = document.getElementById('rejectPhotos-' + recordId);
      const record = historyRecords[recordId];
      if (!list || !record) return;
      list.innerHTML = record.rejection_photos.map((url, index) => `
        <div class="photo-preview-item">
          <img src="${url}" alt="写真${index + 1}">
          <button type="button" class="photo-preview-remove" onclick="removeInlinePhoto('${recordId}', ${index})">×</button>
        </div>
      `).join('');
    }

    // 拒否パネルの写真削除
    function removeInlinePhoto(recordId, index) {
      const record = historyRecords[recordId];
      if (!record) return;
      record.rejection_photos.splice(index, 1);
      renderInlinePhotos(recordId);
    }

    // 拒否を保存（UPDATE）
    async function saveRejection(recordId) {
      const record = historyRecords[recordId];
      if (!record) return;
      const reason = document.getElementById('rejectReason-' + recordId).value;
      try {
        const { error } = await window.supabase
          .from('shimatsusho_records')
          .update({
            approval_status: 'rejected',
            rejection_reason: reason,
            rejection_photos: record.rejection_photos,
            updated_at: new Date().toISOString()
          })
          .eq('id', recordId);
        if (error) throw error;
        showMessage('✅ 拒否を保存しました（理由・写真も記録）');
        loadHistory();
      } catch (error) {
        console.error('保存エラー:', error);
        showMessage('保存に失敗しました: ' + error.message, 'error');
      }
    }

    // 履歴から記録をフォームに読み込み
    async function loadRecordToForm(recordId) {
      try {
        const { data, error } = await window.supabase
          .from('shimatsusho_records')
          .select('*')
          .eq('id', recordId)
          .single();

        if (error) throw error;
        if (!data) {
          showMessage('記録が見つかりません', 'error');
          return;
        }

        // フォームに読み込み
        document.getElementById('instructionDate').value = data.instruction_date || '';
        document.getElementById('instructorName').value = data.created_by || '';
        document.getElementById('staffName').value = data.staff_name || '';
        document.getElementById('incidentDateTime').value = data.incident_datetime || '';
        document.getElementById('instructionContent').value = data.instruction_content || '';
        document.getElementById('companyImpact').value = data.company_impact || '';
        document.getElementById('factConfirmation').value = data.fact_confirmation || '';
        document.getElementById('improvementPlan').value = data.improvement_plan || '';
        document.getElementById('preventionPledge').value = data.prevention_pledge || '';

        // カテゴリーをリセットして、保存されたものを選択
        document.querySelectorAll('.chip').forEach(chip => {
          chip.classList.remove('selected');
        });
        if (data.categories && Array.isArray(data.categories)) {
          data.categories.forEach(category => {
            const chip = document.querySelector(`.chip[data-category="${category}"]`);
            if (chip) chip.classList.add('selected');
          });
        }
        updateSelectedCategoryDisplay();

        // 本人の対応を読み込み
        const approvalValue = data.approval_status || '';
        const approvalRadio = document.querySelector(`input[name="approvalStatus"][value="${approvalValue}"]`);
        if (approvalRadio) approvalRadio.checked = true;
        document.getElementById('rejectionFields').style.display = approvalValue === 'rejected' ? 'block' : 'none';
        document.getElementById('rejectionReason').value = data.rejection_reason || '';
        updateApprovalDisplay();

        // 写真を読み込み
        uploadedPhotos = Array.isArray(data.rejection_photos) ? data.rejection_photos.slice() : [];
        renderPhotoPreviews();

        // 受理情報を読み込み
        document.getElementById('isAccepted').checked = !!data.is_accepted;
        document.getElementById('acceptedBy').value = data.accepted_by || '';
        document.getElementById('acceptedDate').value = data.accepted_at ? data.accepted_at.split('T')[0] : '';

        // 編集モードON
        editingRecordId = recordId;
        document.getElementById('editModeStaff').textContent = data.staff_name || '';
        document.getElementById('editModeBanner').style.display = 'flex';

        // 「記入フォーム」タブに切り替え
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelector('.tab-button:first-child').classList.add('active');
        document.getElementById('form-tab').classList.add('active');
        window.scrollTo(0, 0);

        showMessage(`✅ 記録を読み込みました（${data.staff_name}）※修正して保存できます`);
      } catch (error) {
        console.error('読み込みエラー:', error);
        showMessage('読み込みに失敗しました: ' + error.message, 'error');
      }
    }

    // チップのクリック処理
    function setupChipListeners() {
      const chips = document.querySelectorAll('.chip');
      chips.forEach(chip => {
        chip.addEventListener('click', function() {
          this.classList.toggle('selected');
          updateSelectedCategoryDisplay();
        });
      });
    }

    // 本人の対応ラジオの処理
    function setupApprovalListeners() {
      document.querySelectorAll('input[name="approvalStatus"]').forEach(radio => {
        radio.addEventListener('change', function() {
          const rejectionFields = document.getElementById('rejectionFields');
          rejectionFields.style.display = this.value === 'rejected' ? 'block' : 'none';
          updateApprovalDisplay();
        });
      });
    }

    // 印刷用：選択された対応の表示を更新
    function updateApprovalDisplay() {
      const radio = document.querySelector('input[name="approvalStatus"]:checked');
      const display = document.getElementById('selectedApprovalDisplay');
      if (!radio || !radio.value) {
        display.textContent = '未対応';
        return;
      }
      display.textContent = radio.value === 'agreed' ? '同意する' : '拒否する';
    }

    // 写真アップロード（リサイズしてBase64化）
    function setupPhotoUpload() {
      const input = document.getElementById('rejectionPhotoInput');
      input.addEventListener('change', async function(e) {
        const files = Array.from(e.target.files);
        for (const file of files) {
          try {
            const dataUrl = await resizeImage(file, 1000, 0.7);
            uploadedPhotos.push(dataUrl);
          } catch (err) {
            console.error('画像処理エラー:', err);
          }
        }
        renderPhotoPreviews();
        input.value = ''; // 同じファイルを再選択できるようにリセット
      });
    }

    // 画像をリサイズしてBase64データURLに変換
    function resizeImage(file, maxSize, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            let { width, height } = img;
            if (width > height && width > maxSize) {
              height = Math.round(height * maxSize / width);
              width = maxSize;
            } else if (height > maxSize) {
              width = Math.round(width * maxSize / height);
              height = maxSize;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 写真プレビューを描画
    function renderPhotoPreviews() {
      const list = document.getElementById('photoPreviewList');
      list.innerHTML = uploadedPhotos.map((url, index) => `
        <div class="photo-preview-item">
          <img src="${url}" alt="写真${index + 1}">
          <button type="button" class="photo-preview-remove" onclick="removePhoto(${index})">×</button>
        </div>
      `).join('');
    }

    // 写真を削除
    function removePhoto(index) {
      uploadedPhotos.splice(index, 1);
      renderPhotoPreviews();
    }

    // 編集モードを解除して新規作成に戻る
    function cancelEdit() {
      editingRecordId = null;
      document.getElementById('editModeBanner').style.display = 'none';
      handleResetSilent();
      showMessage('新規作成モードに戻りました');
    }

    // 選択済みカテゴリーの表示を更新
    function updateSelectedCategoryDisplay() {
      const selected = Array.from(document.querySelectorAll('.chip.selected'))
        .map(chip => chip.getAttribute('data-category'));

      const display = document.getElementById('selectedCategoryDisplay');
      if (selected.length > 0) {
        display.innerHTML = selected
          .map(cat => `<span class="selected-category-item">・${cat}</span>`)
          .join('');
      } else {
        display.innerHTML = '';
      }
    }

    // 印刷処理
    function handlePrint() {
      // 本人の対応
      const approvalRadio = document.querySelector('input[name="approvalStatus"]:checked');
      const approvalStatus = approvalRadio ? approvalRadio.value : '';
      const approvalLabel = approvalStatus === 'agreed' ? '同意する'
        : approvalStatus === 'rejected' ? '拒否する' : '未対応';

      // 現在のフォーム内容を取得
      const formData = {
        instructionDate: document.getElementById('instructionDate').value,
        instructorName: document.getElementById('instructorName').value,
        staffName: document.getElementById('staffName').value,
        incidentDateTime: document.getElementById('incidentDateTime').value,
        categories: Array.from(document.querySelectorAll('.chip.selected')).map(c => c.getAttribute('data-category')),
        instructionContent: document.getElementById('instructionContent').value,
        companyImpact: document.getElementById('companyImpact').value,
        factConfirmation: document.getElementById('factConfirmation').value,
        improvementPlan: document.getElementById('improvementPlan').value,
        preventionPledge: document.getElementById('preventionPledge').value,
        approvalStatus: approvalStatus,
        approvalLabel: approvalLabel,
        rejectionReason: document.getElementById('rejectionReason').value,
        rejectionPhotos: uploadedPhotos.slice(),
        isAccepted: document.getElementById('isAccepted').checked,
        acceptedBy: document.getElementById('acceptedBy').value,
        acceptedDate: document.getElementById('acceptedDate').value
      };

      // 印刷用ウィンドウを開く
      const printWindow = window.open('', 'print', 'width=800,height=600');

      // 印刷用HTMLを生成
      const printHTML = generatePrintHTML(formData);

      printWindow.document.write(printHTML);
      printWindow.document.close();

      // ウィンドウの読み込み完了後に印刷
      printWindow.onload = function() {
        printWindow.focus();
        setTimeout(() => {
          printWindow.print();
          printWindow.close();
        }, 250);
      };
    }

    // 印刷用HTML生成
    function generatePrintHTML(data) {
      return `
        <!DOCTYPE html>
        <html lang="ja">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>始末書</title>
          <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { font-family: "Noto Sans JP", sans-serif; line-height: 1.6; }
            @page { size: A4 portrait; margin: 15mm; }
            @media print {
              body { font-size: 10pt; }
              input, textarea { border: none; border-bottom: 1px solid #333; background: transparent; padding: 4px 0 2px 0; color: #333; }
              textarea { min-height: 50pt; }
            }
            .container { max-width: 210mm; padding: 20px; }
            .title { text-align: center; font-size: 20pt; font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; }
            .company { text-align: center; font-size: 12pt; margin-bottom: 30px; }
            .section { margin-bottom: 20px; page-break-inside: avoid; }
            .section-header { background: #333; color: white; padding: 10px 15px; font-weight: bold; font-size: 12pt; }
            .form-row { display: grid; grid-template-columns: 120px 1fr; gap: 15px; margin-bottom: 12px; align-items: start; }
            .form-label { font-weight: bold; font-size: 11pt; }
            .form-value { font-size: 11pt; padding: 4px 0 2px 0; border-bottom: 1px solid #333; min-height: 20px; }
            .signature-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 40px; }
            .signature-box { border: 1px solid #333; padding: 60px 10px 10px; text-align: center; font-size: 10pt; position: relative; }
            .signature-label { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); font-size: 9pt; }
          </style>
        </head>
        <body>
          <div class="container">
            <div class="title">始　末　書</div>
            <div class="company">ANELLA CAFE 大分店</div>

            <div class="section">
              <div class="section-header">PART A: 指導内容</div>
              <div class="form-row">
                <div class="form-label">指導日付</div>
                <div class="form-value">${data.instructionDate}</div>
              </div>
              <div class="form-row">

                <div class="form-value">${data.instructorName}</div>
              </div>
              <div class="form-row">
                <div class="form-label">スタッフ名</div>
                <div class="form-value">${data.staffName}</div>
              </div>
              <div class="form-row">
                <div class="form-label">発生日時</div>
                <div class="form-value">${data.incidentDateTime}</div>
              </div>
              <div class="form-row">
                <div class="form-label">指導の種別</div>
                <div class="form-value">${data.categories.join('、')}</div>
              </div>
              <div class="form-row">
                <div class="form-label">指導内容</div>
                <div class="form-value" style="grid-column: 2; white-space: pre-wrap; min-height: 60px;">${data.instructionContent}</div>
              </div>
              <div class="form-row">
                <div class="form-label">会社への影響</div>
                <div class="form-value" style="grid-column: 2; white-space: pre-wrap; min-height: 60px;">${data.companyImpact}</div>
              </div>
            </div>

            <div class="section">
              <div class="section-header">PART B: 改善策・再発防止</div>
              <div class="form-row">
                <div class="form-label">事実の確認</div>
                <div class="form-value" style="grid-column: 2; white-space: pre-wrap; min-height: 60px;">${data.factConfirmation}</div>
              </div>
              <div class="form-row">
                <div class="form-label">改善策</div>
                <div class="form-value" style="grid-column: 2; white-space: pre-wrap; min-height: 60px;">${data.improvementPlan}</div>
              </div>
              <div class="form-row">
                <div class="form-label">再発防止</div>
                <div class="form-value" style="grid-column: 2; white-space: pre-wrap; min-height: 60px;">${data.preventionPledge}</div>
              </div>
            </div>

            <div class="section">
              <div class="section-header">本人の対応</div>
              <div class="form-row">
                <div class="form-label">本人の意思</div>
                <div class="form-value">${data.approvalLabel}</div>
              </div>
              ${data.approvalStatus === 'rejected' ? `
              <div class="form-row">
                <div class="form-label">拒否の理由</div>
                <div class="form-value" style="grid-column: 2; white-space: pre-wrap; min-height: 50px;">${data.rejectionReason || ''}</div>
              </div>
              ${data.rejectionPhotos && data.rejectionPhotos.length > 0 ? `
              <div style="margin-top: 12px;">
                <div class="form-label" style="margin-bottom: 8px;">写真</div>
                <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                  ${data.rejectionPhotos.map(url => `<img src="${url}" style="max-width: 45%; max-height: 200px; border: 1px solid #333;">`).join('')}
                </div>
              </div>
              ` : ''}
              ` : ''}
            </div>

            <div class="section">
              <div class="section-header">会社の受理</div>
              <div class="form-row">
                <div class="form-label">受理状況</div>
                <div class="form-value">${data.isAccepted ? '受理済み' : '未受理'}</div>
              </div>
              ${data.isAccepted ? `
              <div class="form-row">
                <div class="form-label">受理担当者</div>
                <div class="form-value">${data.acceptedBy || ''}</div>
              </div>
              <div class="form-row">
                <div class="form-label">受理日</div>
                <div class="form-value">${data.acceptedDate || ''}</div>
              </div>
              ` : ''}
            </div>

            <div class="signature-row">
              <div class="signature-box">
                <div class="signature-label">スタッフ</div>
              </div>
              <div class="signature-box">
                <div class="signature-label">直属上長</div>
              </div>
              <div class="signature-box">
                <div class="signature-label">代表確認</div>
              </div>
            </div>
          </div>
        </body>
        </html>
      `;
    }

    // リセット処理（確認あり）
    function handleReset() {
      if (confirm('本当に全ての入力内容をリセットしますか？')) {
        handleResetSilent();
        // 編集モードも解除
        editingRecordId = null;
        document.getElementById('editModeBanner').style.display = 'none';
      }
    }

    // リセット本体（確認なし）
    function handleResetSilent() {
      document.getElementById('instructionDate').value = '';
      document.getElementById('instructorName').value = '';
      document.getElementById('staffName').value = '';
      document.getElementById('incidentDateTime').value = '';
      document.getElementById('instructionContent').value = '';
      document.getElementById('companyImpact').value = '';
      document.getElementById('factConfirmation').value = '';
      document.getElementById('improvementPlan').value = '';
      document.getElementById('preventionPledge').value = '';

      // チップを全て選択解除
      document.querySelectorAll('.chip').forEach(chip => {
        chip.classList.remove('selected');
      });
      updateSelectedCategoryDisplay();

      // 本人の対応をリセット
      const noneRadio = document.querySelector('input[name="approvalStatus"][value=""]');
      if (noneRadio) noneRadio.checked = true;
      document.getElementById('rejectionFields').style.display = 'none';
      document.getElementById('rejectionReason').value = '';
      uploadedPhotos = [];
      renderPhotoPreviews();
      updateApprovalDisplay();

      // 受理情報をリセット
      document.getElementById('isAccepted').checked = false;
      document.getElementById('acceptedBy').value = '';
      document.getElementById('acceptedDate').value = '';

      // 日付をリセット
      setDefaultDates();
    }

    // 初期化
    window.addEventListener('DOMContentLoaded', function() {
      setDefaultDates();
      setupChipListeners();
      setupApprovalListeners();
      setupPhotoUpload();
      updateApprovalDisplay();
    });
  </script>
</body>
</html>
