name: Travel Threads Auto Post

on:
  schedule:
    # 毎日 19:00 JST（10:00 UTC）に実行
    - cron: '0 10 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./CPO（プロダクト責任者）/アウトプット/rakuten-travel-threads
        run: npm install

      - name: Create .env file
        working-directory: ./CPO（プロダクト責任者）/アウトプット/rakuten-travel-threads
        run: |
          cat > .env << 'EOF'
          RAKUTEN_APPLICATION_ID=${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY=${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID=${{ secrets.RAKUTEN_AFFILIATE_ID }}
          THREADS_APP_ID=${{ secrets.THREADS_APP_ID }}
          THREADS_USER_ID=${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN=${{ secrets.THREADS_ACCESS_TOKEN }}
          SEARCH_KEYWORDS=${{ secrets.SEARCH_KEYWORDS }}
          TIMEZONE=Asia/Tokyo
          POST_HOUR=19
          EOF

      - name: Run daily post
        working-directory: ./CPO（プロダクト責任者）/アウトプット/rakuten-travel-threads
        run: npm run post

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: post-logs
          path: ./CPO（プロダクト責任者）/アウトプット/rakuten-travel-threads/logs/
          retention-days: 7
